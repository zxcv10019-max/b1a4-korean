name: Build transparent Windows desktop
on:
  push:
    branches: [main]
    paths: ['desktop-transparent/**', '.github/workflows/desktop-transparent.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-transparent
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native transparent window
        run: |
          node test-auth.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop login test failed' }
          & ./node_modules/.bin/electron.cmd . --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Transparent desktop verification failed' }
          Get-Content smoke-result.json
      - name: Package Windows app
        run: |
          $desktopOutput = Join-Path $PWD 'dist/BANA-Forest-Desktop'
          New-Item -ItemType Directory -Path $desktopOutput -Force | Out-Null
          Copy-Item -LiteralPath node_modules/electron/dist -Destination (Join-Path $desktopOutput 'runtime') -Recurse
          $desktopApp = Join-Path $desktopOutput 'runtime/resources/app'
          New-Item -ItemType Directory -Path $desktopApp -Force | Out-Null
          foreach ($desktopFile in @('main.cjs','preload.cjs','skin.js','login.js','auth-handoff.cjs','package.json','logo.png','perf-check.js')) { Copy-Item -LiteralPath $desktopFile -Destination $desktopApp }
          $desktopCompiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $desktopCompiler /nologo /target:winexe /optimize+ '/reference:System.Windows.Forms.dll' '/win32icon:app.ico' ("/out:" + (Join-Path $desktopOutput 'BANA-Forest-Desktop.exe')) Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop launcher compile failed' }
          Copy-Item -LiteralPath README.md -Destination (Join-Path $desktopOutput 'README.txt')
          Copy-Item -LiteralPath fixture.html -Destination $desktopApp
          $desktopCheck = Start-Process -FilePath (Join-Path $desktopOutput 'runtime/electron.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($desktopCheck.ExitCode -ne 0) { throw 'Packaged desktop verification failed' }
          Get-Content -LiteralPath (Join-Path $desktopApp 'smoke-result.json')
          Remove-Item -LiteralPath (Join-Path $desktopApp 'fixture.html'),(Join-Path $desktopApp 'smoke-result.json'),(Join-Path $desktopApp 'smoke-transparent.png')
          & 7z a -tzip -mx=3 BANA-Forest-Desktop-0.2.3.zip $desktopOutput
          if ($LASTEXITCODE -ne 0) { throw 'Desktop archive failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: BANA-Forest-Desktop-0.2.3
          path: desktop-transparent/BANA-Forest-Desktop-0.2.3.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transparent-desktop-check
          path: |
            desktop-transparent/smoke-result.json
            desktop-transparent/smoke-transparent.png
      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-0.2.3
          if ($LASTEXITCODE -eq 0) {
            gh release upload desktop-0.2.3 BANA-Forest-Desktop-0.2.3.zip --clobber
          } else {
            gh release create desktop-0.2.3 BANA-Forest-Desktop-0.2.3.zip --title 'BANA Forest 透明電腦版 0.2.3' --notes-file README.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release failed' }
