name: Build transparent Windows desktop
on:
  push:
    branches: [main]
    paths: ['desktop-transparent/**', '.github/workflows/desktop-transparent.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-transparent
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native transparent window
        run: |
          & ./node_modules/.bin/electron.cmd . --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Transparent desktop verification failed' }
          Get-Content smoke-result.json
      - name: Package Windows app
        run: |
          & ./node_modules/.bin/electron-packager.cmd . BANA-Forest-Desktop --platform=win32 --arch=x64 --out=dist --overwrite --icon=app.ico --ignore='smoke-.*|fixture.html|README.md'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop package failed' }
          Copy-Item -LiteralPath README.md -Destination dist/BANA-Forest-Desktop-win32-x64/README.txt
          Compress-Archive -Path dist/BANA-Forest-Desktop-win32-x64 -DestinationPath BANA-Forest-Desktop-0.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BANA-Forest-Desktop-0.2.0
          path: desktop-transparent/BANA-Forest-Desktop-0.2.0.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transparent-desktop-check
          path: |
            desktop-transparent/smoke-result.json
            desktop-transparent/smoke-transparent.png
      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create desktop-0.2.0 BANA-Forest-Desktop-0.2.0.zip --title 'BANA Forest 透明電腦版 0.2.0' --notes-file README.md --target $env:GITHUB_SHA
