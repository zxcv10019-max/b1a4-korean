name: Android build and content update

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-content-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare current website for Android
        run: |
          python3 android/apply-reader-nav.py index.html
          python3 android/prepare-ci-assets.py
      - name: Test release packaging
        run: python3 android/test-web-release.py
      - name: Compile APK
        run: python3 android/build-direct.py
      - name: Test native update validators
        run: |
          javac -encoding UTF-8 -cp "android/build/classes:$ANDROID_HOME/platforms/android-36/android.jar" -d android/build/classes android/test-updates/WebUpdateStoreTest.java
          java -cp "android/build/classes:$ANDROID_HOME/platforms/android-36/android.jar" tw.bana.forest.WebUpdateStoreTest
      - name: Prepare APK for original-key signing
        run: |
          mkdir -p android/signing-kit
          cp android/build/aligned-unsigned.apk android/signing-kit/BANA-Forest-0.6.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/signing-kit/apksigner.jar
          cp android/SIGN-LOCALLY.md android/signing-kit/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BANA-Forest-0.6.0-signing-kit
          path: android/signing-kit/
          retention-days: 14
      - name: Build offline content update
        env:
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          python3 android/make-web-release.py --version-code "$((1000 + RELEASE_CODE))" --version "2026.11.20.$RELEASE_CODE" --notes '同步最新 BANA Forest 頁面與功能' --output updates
      - name: Publish content files to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html updates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Android offline content update [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
